name: Публикация релиза

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Проверка перед публикацией
        run: |
          go vet ./...
          go test -count=1 ./...
          python3 deploy/test_update.py

      - name: Сборка веб-сервера
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          make build
          tar -czf "hkc-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C bin hkc-web
          sha256sum "hkc-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz" > "hkc-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          name: hrk-console ${{ github.ref_name }}
          # Автоматические заголовки GitHub бывают английскими; используем русский текст ниже.
          generate_release_notes: false
          body: |
            Релиз веб-панели hrk-console ${{ github.ref_name }}.

            ### Что изменилось

            - История действий: постраничный список и отдельная панель подробностей. На телефоне подробности открываются в диалоге.
            - Модули отображаются сеткой карточек: до 12 на компьютере и до 6 на телефоне, с поиском, фильтрами и обновлением раз в секунду.
            - Добавлены плавное раскрытие и закрытие модулей, переходы истории, живой индикатор загрузки и световой проход при входе.
            - Исправлены наведение вкладок и подсветка счётчиков; Redis и Database убраны из редактора без удаления сохранённых значений.
            - Полностью удалены диагностика, терминал и их API, включая произвольное выполнение shell-команд.
            - Важно: при включённом восстановлении ручная остановка также приводит к автоматическому запуску. Для длительной остановки отключите восстановление.

            - История проекта: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
            - В релиз входит один статически собранный Linux-сервер `hkc-web` и его контрольная сумма SHA-256.
          files: |
            hkc-web-*-linux-amd64.tar.gz
            hkc-web-*-linux-amd64.tar.gz.sha256
