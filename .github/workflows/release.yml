name: Публикация релиза

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Проверка перед публикацией
        run: |
          go vet ./...
          go test -count=1 ./...
          python3 deploy/test_update.py

      - name: Сборка веб-сервера
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          # Один архив на архитектуру; установщик и Центр обновления выбирают его по uname.
          for arch in amd64 arm64; do
            GOARCH="$arch" make build
            name="hkc-web-${GITHUB_REF_NAME}-linux-${arch}.tar.gz"
            tar -czf "$name" -C bin hkc-web
            sha256sum "$name" > "$name.sha256"
          done
          cp deploy/install.sh install.sh

      - uses: softprops/action-gh-release@v2
        with:
          name: hrk-console ${{ github.ref_name }}
          # Автоматические заголовки GitHub бывают английскими; используем русский текст ниже.
          generate_release_notes: false
          body: |
            Релиз веб-панели hrk-console ${{ github.ref_name }}.

            - Что изменилось: [CHANGELOG.md](https://github.com/ayanamisuicide/hrk-console/blob/main/CHANGELOG.md).
            - Архивы содержат сборки hkc-web для Linux amd64 и arm64, рядом лежат контрольные суммы SHA-256.
            - Установка одной командой: `curl -fsSL https://github.com/ayanamisuicide/hrk-console/releases/latest/download/install.sh | sudo bash`

          files: |
            hkc-web-*-linux-*.tar.gz
            hkc-web-*-linux-*.tar.gz.sha256
            install.sh
