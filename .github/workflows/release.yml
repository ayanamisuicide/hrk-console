name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: verify
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: build web server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          make build
          tar -czf "hkc-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C bin hkc-web
          sha256sum "hkc-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz" > "hkc-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          name: hrk-console ${{ github.ref_name }}
          body: |
            Web-only релиз hrk-console 2.0.

            - Управление Heroku полностью перенесено в браузерную панель.
            - Добавлены пользовательские аккаунты, одноразовые инвайты и административная панель.
            - Удалены TUI, нативные приложения Linux/Windows, Windows bootstrap и SSH-клиент GUI.
            - В релиз входит один статически собранный Linux-сервер `hkc-web` и его SHA-256 checksum.
          files: |
            hkc-web-*-linux-amd64.tar.gz
            hkc-web-*-linux-amd64.tar.gz.sha256
