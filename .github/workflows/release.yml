name: Публикация релиза

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Проверка перед публикацией
        run: |
          go vet ./...
          go test -count=1 ./...
          python3 deploy/test_update.py

      - name: Сборка веб-сервера
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          make build
          tar -czf "hkc-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C bin hkc-web
          sha256sum "hkc-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz" > "hkc-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          name: hrk-console ${{ github.ref_name }}
          # Автоматические заголовки GitHub бывают английскими; используем русский текст ниже.
          generate_release_notes: false
          body: |
            Релиз веб-панели hrk-console v2.2.34.

            ### Что изменилось

            - Десктопный интерфейс получил атмосферу орбитальной станции: холодную палитру, HUD-метки и технические рамки.
            - Админка и Центр обновления используют общую визуальную систему.
            - Мобильное оформление не менялось; обновлён ключ кеша PWA.

            - История изменений: [CHANGELOG.md](https://github.com/ayanamisuicide/hrk-console/blob/main/CHANGELOG.md).
            - В архив входят Linux amd64-сборка hkc-web и контрольная сумма SHA-256.

          files: |
            hkc-web-*-linux-amd64.tar.gz
            hkc-web-*-linux-amd64.tar.gz.sha256
