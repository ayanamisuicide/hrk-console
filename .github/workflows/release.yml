name: Публикация релиза

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Проверка перед публикацией
        run: |
          go vet ./...
          go test -count=1 ./...
          python3 deploy/test_update.py

      - name: Сборка веб-сервера
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          make build
          tar -czf "hkc-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C bin hkc-web
          sha256sum "hkc-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz" > "hkc-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          name: hrk-console ${{ github.ref_name }}
          # Автоматические заголовки GitHub бывают английскими; используем русский текст ниже.
          generate_release_notes: false
          body: |
            Релиз веб-панели hrk-console ${{ github.ref_name }}.

            ### Что изменилось

            - Новый раздел «Модули»: загрузка, готовность, ошибки, поиск и фильтры с обновлением раз в секунду.
            - Автоматическое восстановление бота после остановки или зависания основного цикла Python; по умолчанию — через три минуты.
            - Полностью обновлена компоновка админки: шесть рабочих областей, компактная история, отдельные вкладки копий и снимков настроек.
            - Удалены режим обслуживания и одноразовое расписание; старые задания больше не исполняются.
            - Важно: при включённом восстановлении ручная остановка также приводит к автоматическому запуску. Для длительной остановки отключите восстановление.

            - Полный список изменений: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
            - В релиз входит один статически собранный Linux-сервер `hkc-web` и его контрольная сумма SHA-256.
          files: |
            hkc-web-*-linux-amd64.tar.gz
            hkc-web-*-linux-amd64.tar.gz.sha256
