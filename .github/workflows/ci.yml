name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Форматирование Go
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }

      - name: Статическая проверка Go
        run: go vet ./...

      - name: Тесты Go и проверка гонок
        run: go test -count=1 -race ./...

      - name: Сборка веб-сервера
        run: make build

      - name: Проверка целостности обновления и отката
        run: python3 deploy/test_update.py

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: test-results/
